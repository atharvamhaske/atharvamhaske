name: Refresh profile card

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, config.json, assets/fonts/**, .github/workflows/card.yml]

permissions:
  contents: write

concurrency: card

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install renderer and fonts
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-dejavu-core
          mkdir -p ~/.local/share/fonts && cp assets/fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f
      - name: Build card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/card.mjs
          for t in light dark; do rsvg-convert build/card-$t.svg -o assets/card-$t.png; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/card-*.png
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile card"
          git push
